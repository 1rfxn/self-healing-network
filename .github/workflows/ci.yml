name: CI — Self-Healing Network AIOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend tests ────────────────────────────────────────────────────────────
  backend:
    name: Python backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate training data
        run: python generate_data.py

      - name: Train ML models
        run: python src/detect.py --train --csv data/normal_telemetry_2hr.csv

      - name: Smoke test — backend starts and /health responds
        run: |
          python src/main.py --demo --skip-train &
          BACKEND_PID=$!
          sleep 6
          curl -sf http://localhost:5000/health | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Unexpected: {d}'
          print('✓ /health OK:', d)
          "
          kill $BACKEND_PID

      - name: Smoke test — inject endpoint responds
        run: |
          python src/main.py --demo --skip-train &
          BACKEND_PID=$!
          sleep 6
          curl -sf -X POST http://localhost:5000/api/inject/dev1/high_loss | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('ok') == True, f'Unexpected: {d}'
          print('✓ /api/inject OK:', d)
          "
          kill $BACKEND_PID

  # ── Frontend build ───────────────────────────────────────────────────────────
  frontend:
    name: React dashboard build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install npm packages
        working-directory: dashboard
        run: npm ci --prefer-offline

      - name: Build React app
        working-directory: dashboard
        env:
          CI: false   # treat warnings as warnings not errors
          REACT_APP_WS_URL: http://localhost:5000
          REACT_APP_API_URL: http://localhost:5000
        run: npm run build

      - name: Check build output exists
        run: |
          test -f dashboard/build/index.html && echo "✓ build/index.html exists"
          ls -lh dashboard/build/static/js/*.js | head -3

